    /* Independent Ubuntu learning lab — responsive vi practice */
    .vi-zone{margin-top:20px;background:#0b1422;border:1px solid #506377;border-radius:14px;overflow:hidden;min-width:0}
    .vi-header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 15px;background:#182638;border-bottom:1px solid #34465a}
    .vi-header strong{font:750 13px ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
    .vi-badge{margin-left:10px;border-radius:5px;background:#324357;padding:3px 7px;color:#e2effa;font:800 10px ui-monospace,SFMono-Regular,Consolas,monospace}
    .vi-badge.insert{background:#346657;color:#ccfbe5}
    .vi-tip{color:#afc7d9;font-size:12px;padding:10px 15px;background:#102237;border-bottom:1px solid #34465a}
    .vi-textarea{display:block;width:100%;min-width:0;min-height:260px;padding:14px 16px;resize:vertical;background:#07101a;color:#edf5fb;border:0;border-radius:0;font:13px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;outline:0;tab-size:2}
    .vi-textarea:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
    .vi-textarea[readonly]{color:#b5c7d4;cursor:default}
    .vi-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 13px;background:#142335;border-top:1px solid #34465a}
    .vi-toolbar .btn.primary{margin-left:auto}
    .vi-foot{padding:9px 14px;background:#1c2d3b;color:#9fb1c4;font-size:11px}
    .terminal-form label{max-width:48%;overflow:hidden;text-overflow:ellipsis}
    .lesson-list,.detail,.terminal-zone,.vi-zone{min-width:0}

  {title:'Hello, Ubuntu',short:'Meet Linux & the terminal',time:'4 min',level:'START HERE',subtitle:'Get comfortable with the window that lets you talk to Linux.',concept:'Linux is the operating-system kernel. <strong>Ubuntu is a Linux distribution</strong> built around it. The Terminal runs text commands through a shell.',takeaway:'First, learn where you are and who you are.',steps:[
    {text:'Ask Linux which folder you are in.',note:'Print your working directory.',hint:'pwd'},
    {text:'Find out your current username.',note:'Who is signed in?',hint:'whoami'},

  {title:'Find your way',short:'Move through folders',time:'5 min',level:'NAVIGATION',subtitle:'Explore your files without needing to click through folders.',concept:'The <code>pwd</code> command tells you where you are, <code>ls</code> lists what is there, and <code>cd</code> changes your current directory.',takeaway:'Paths are case-sensitive: Documents and documents are different.',steps:[

  {title:'Create files & folders',short:'Build your workspace',time:'5 min',level:'FILES',subtitle:'Create a project folder and put a new file inside it.',concept:'Use <code>mkdir</code> to make a directory (folder), and <code>touch</code> to create an empty file or update a file timestamp.',takeaway:'You can use a path to create a file inside a folder.',steps:[

  {title:'Permissions 101',short:'Understand access rights',time:'5 min',level:'SECURITY',subtitle:'Find out who can read, write, and run a file.',concept:'In <code>ls -l</code>, the letters <code>r</code>, <code>w</code>, and <code>x</code> describe read, write, and execute permissions. <code>chmod +x</code> adds execute permission.',takeaway:'Do not run unfamiliar scripts simply because they are executable.',steps:[

  {title:'Ubuntu software',short:'Meet apt and sudo',time:'6 min',level:'UBUNTU',subtitle:'Understand how Ubuntu can find and install software.',concept:'Ubuntu uses the <code>apt</code> package manager. <code>sudo</code> runs an approved command with administrative privileges. Review commands before using sudo on a real computer.',takeaway:'Everything here is simulated: no program will be installed.',steps:[

  {title:'Linux project challenge',short:'Put your skills together',time:'7 min',level:'CAPSTONE',subtitle:'Create a new project, make notes, and check your results.',concept:'A few simple commands can form a complete workflow. This mission checks that you can create a folder, enter it, create a file, write text, and read it back.',takeaway:'Finish this mission to complete your Ubuntu starter path.',steps:[

  ,{title:'Ubuntu in a virtual machine',short:'Understand host vs. guest',time:'5 min',level:'DESKTOP & VM',subtitle:'Learn where Ubuntu runs when it is launched inside virtualization software.',concept:'A <strong>virtual machine (VM)</strong> is a computer simulated by software. Your regular computer is the <strong>host</strong>; Ubuntu is the <strong>guest operating system</strong>. The guest has its own desktop, filesystem, and terminal.',takeaway:'Practice commands inside the Ubuntu VM, not the host computer. Our web lab is a command simulator, not a VM.',steps:[

  ],quiz:{q:'In an Ubuntu virtual machine, what does “guest” mean?',options:['The operating system running inside the VM','Your computer’s physical keyboard','The computer that hosts the VM'],correct:0,why:'The guest is the OS inside a virtual machine; the host runs the virtualization software.'}},
  {title:'Edit with vi',short:'Normal mode & insert mode',time:'8 min',level:'VI EDITOR',subtitle:'Edit a real-looking shell script using an interactive, simplified vi practice editor.',concept:'In <code>vi</code>, <strong>Normal mode</strong> handles commands and <strong>Insert mode</strong> edits text. Press <code>i</code> to insert, <code>Esc</code> to return to Normal, and <code>:wq</code> to save and quit.',takeaway:'This editor teaches vi modes and saving. It is not a complete Vim implementation.',steps:[

    {text:'Insert a shebang and an echo statement; then save and quit.',note:'Enter #!/bin/bash on line 1 and echo Hello from vi on line 2. Use i, Esc and :wq.',hint:'#!/bin/bash\necho Hello from vi'},
    {text:'Run the script using Bash.',note:'You should see Hello from vi.',hint:'bash hello.sh'}
  ],quiz:{q:'Which keys save and exit vi from Normal mode?',options:[':wq followed by Enter','Ctrl+C','i followed by Enter'],correct:0,why:':wq writes the file and quits; pressing Esc first ensures you are back in Normal mode.'}},
  {title:'Variables & shell scripts',short:'Create a reusable Bash script',time:'8 min',level:'BASH',subtitle:'Store data in a variable and use it inside a command.',concept:'In Bash, set a variable with <code>name="Linux"</code> (no spaces around <code>=</code>). Read the variable with <code>$name</code>. A script often begins with <code>#!/bin/bash</code>.',takeaway:'<code>bash script.sh</code> explicitly runs the script with Bash; it does not require execute permission.',steps:[
    {text:'Open greet.sh in vi.',note:'Make a script with a variable.',hint:'vi greet.sh'},
    {text:'Write a variable assignment and a message; save.',note:'Use name="Linux" and echo "Hello $name" on separate lines.',hint:'#!/bin/bash\nname="Linux"\necho "Hello $name"'},
    {text:'Run greet.sh with Bash.',note:'The output should be Hello Linux.',hint:'bash greet.sh'}
  ],quiz:{q:'How do you read a Bash variable named name?',options:['$name','%name','name()'],correct:0,why:'The $ prefix expands a variable’s value in Bash.'}},
  {title:'For loops',short:'Repeat a command for each item',time:'9 min',level:'BASH LOOPS',subtitle:'Write a loop that prints three numbered items.',concept:'A <code>for</code> loop repeats commands for each item in a list. In Bash, a common pattern is <code>for n in 1 2 3; do ...; done</code>.',takeaway:'Use variables like <code>$n</code> inside the loop to refer to the current item.',steps:[

    {text:'Create a for loop that prints Item 1, Item 2, Item 3; save.',note:'Use a for n in 1 2 3 loop, echo "Item $n" and done.',hint:'#!/bin/bash\nfor n in 1 2 3; do\n  echo "Item $n"\ndone'},
    {text:'Run your for loop.',note:'Check that three lines are printed.',hint:'bash for-loop.sh'}
  ],quiz:{q:'Which keyword ends a Bash for loop?',options:['done','endfor','stop'],correct:0,why:'Bash for and while loops end with done.'}},
  {title:'While loops',short:'Repeat while a condition is true',time:'9 min',level:'BASH LOOPS',subtitle:'Count from one to three and stop at the right time.',concept:'A <code>while</code> loop repeats while its condition remains true. <code>-le</code> means “less than or equal to”. Update the counter or the loop may never end.',takeaway:'A running loop must eventually reach its stopping condition.',steps:[
    {text:'Open while-loop.sh in vi.',note:'Write the counter loop.',hint:'vi while-loop.sh'},
    {text:'Add a counter, while condition, and increment; save.',note:'Set count=1, repeat while $count -le 3, and increment count.',hint:'#!/bin/bash\ncount=1\nwhile [ "$count" -le 3 ]; do\n  echo "Count: $count"\n  count=$((count+1))\ndone'},
    {text:'Run your while loop.',note:'Expect Count: 1 through Count: 3.',hint:'bash while-loop.sh'}
  ],quiz:{q:'Why does count=$((count+1)) matter?',options:['It helps the loop eventually stop','It exits the terminal','It installs Bash'],correct:0,why:'The increment changes the counter so the while condition eventually becomes false.'}},
  {title:'Case statements',short:'Choose between several actions',time:'10 min',level:'BASH CASE',subtitle:'Build a simple text menu using a Bash case statement.',concept:'A <code>case</code> statement compares a value against patterns. Use <code>pattern)</code> for a branch, <code>;;</code> to end the branch, and <code>esac</code> to end the statement.',takeaway:'The <code>*)</code> branch is a helpful fallback for unrecognized values.',steps:[

    {text:'Write a case statement for start, stop and fallback; save.',note:'Set choice="start" and print Starting for the start branch.',hint:'#!/bin/bash\nchoice="start"\ncase "$choice" in\n  start) echo "Starting" ;;\n  stop) echo "Stopping" ;;\n  *) echo "Unknown option" ;;\nesac'},
    {text:'Run menu.sh.',note:'Expect Starting.',hint:'bash menu.sh'}
  ],quiz:{q:'Which keyword closes a Bash case statement?',options:['esac','done','fi'],correct:0,why:'Bash closes case with esac, the reverse of case.'}},
  {title:'If / else conditions',short:'Make a decision in Bash',time:'9 min',level:'BASH LOGIC',subtitle:'Write a script that reacts to a simulated service status.',concept:'Use <code>if [ "$status" = "online" ]; then</code> to test a string. An optional <code>else</code> gives a fallback, and <code>fi</code> closes the condition.',takeaway:'Spaces are important around <code>[</code>, <code>]</code> and <code>=</code> in a test.',steps:[

  {title:'System health basics',short:'Inspect processes & resources',time:'7 min',level:'ADMINISTRATION',subtitle:'Get familiar with process listings and disk and memory usage.',concept:'A system administrator often uses <code>ps</code> to list processes, <code>df -h</code> for disk free space, and <code>free -h</code> for memory. These values here are <strong>fictional demo data</strong>.',takeaway:'On a real Ubuntu VM these commands report the guest system, not necessarily the host.',steps:[

  ,{title:'Single & double quotes',short:'Understand how Bash expands text',time:'8 min',level:'BASH QUOTING',subtitle:'Compare literal single-quoted text with double-quoted variable expansion.',concept:'In Bash, <code>\'$name\'</code> leaves the dollar sign literally in the text, while <code>"$name"</code> expands the variable. Quoting changes how the shell interprets what you type.',takeaway:'Single quotes protect literal characters. Double quotes usually allow variable substitution.',steps:[

  {title:'SSH connection basics',short:'Understand remote access',time:'6 min',level:'SECURE NETWORKING',subtitle:'Learn the shape of a remote connection before using a real server.',concept:'<strong>SSH</strong> (Secure Shell) is an encrypted way to connect to a remote computer. A command such as <code>ssh user@host</code> identifies the username and remote host.',takeaway:'This simulator demonstrates the command but cannot make network connections.',steps:[

function scriptMatchesLesson(index,source){
  const expected={9:'Hello from vi',10:'Hello Linux',11:'Item 1\nItem 2\nItem 3',12:'Count: 1\nCount: 2\nCount: 3',13:'Starting',14:'Service is online',16:'$name\nHello Linux',17:'Count: 1\nCount: 2\nCount: 3'};
  if(!(index in expected))return false;
  if(!source.startsWith('#!/bin/bash'))return false;
  const structure={
    9:/^echo\s+Hello from vi$/m,
    10:/^name=["']?Linux["']?$/m,
    11:/^for\s+[a-zA-Z_]\w*\s+in\s+1\s+2\s+3\s*;\s*do$/m,
    12:/^while\s+\[/m,
    13:/^case\s+.+\s+in$/m,
    14:/^if\s+\[/m,
    16:/^echo\s+'\$name'$/m,
    17:/^until\s+\[/m

  if(!structure[index].test(source))return false;
  if(index===10&&!/echo.*\$name/.test(source))return false;
  if(index===12&&!/count=\$\(\(count\+1\)\)/.test(source))return false;
  if(index===13&&!/\*\)/.test(source))return false;
  if(index===14&&(!/^else$/m.test(source)||!/^fi$/m.test(source)))return false;
  if(index===16&&(!/^echo \"Hello \$name\"$/m.test(source)||!/^name=\"Linux\"$/m.test(source)))return false;
  if(index===17&&(!/count=\$\(\(count\+1\)\)/.test(source)||!/^done$/m.test(source)))return false;
  const result=runBashSubset(source);
  return result.ok&&result.msg===expected[index];
}

function transferMatches(id,raw,res){
  const cmd=res.command,args=res.args;
  const name=args[0]||'';
  const has=(path)=>!!fs[path];
  const paths={9:'hello.sh',10:'greet.sh',11:'for-loop.sh',12:'while-loop.sh',13:'menu.sh',14:'status.sh',16:'quotes.sh',17:'until-loop.sh',21:'report.sh'};
  if(Object.prototype.hasOwnProperty.call(paths,id)){
    const path=(id===21?HOME+'/support-toolkit/':HOME+'/')+paths[id];
    const expected={9:'Edited in vi',10:'Hello Ubuntu',11:'Item 4\nItem 5\nItem 6',12:'Count: 2\nCount: 3',13:'Stopping',14:'Service is offline',16:'$name\nHello Ubuntu',17:'Count: 2\nCount: 3',21:'Unknown service'};
    if(cmd!=='bash'||args.length!==1||norm(name)!==path||!has(path))return false;
    const src=fs[path].content,run=runBashSubset(src);
    const syntactic={9:/echo\s+Edited in vi/,10:/name=["']Ubuntu["']/,11:/for\s+\w+\s+in\s+4 5 6;/,12:/count=2/,13:/choice=["']stop["']/,14:/status=["']offline["']/,16:/name=["']Ubuntu["']/,17:/count=2/,21:/service=["']ssh["']/};
    const structural=id===21?/case\s+[\s\S]+\s+in/:/[\s\S]*/;
    return src.startsWith('#!/bin/bash')&&syntactic[id].test(src)&&structural.test(src)&&run.ok&&run.msg===expected[id];
  }
  switch(id){
    case 0:return cmd==='ls'&&cwd===HOME;
    case 8:return cmd==='whoami'&&res.msg==='student';
    case 1:return cmd==='cd'&&cwd===HOME+'/Desktop';
    case 2:return cmd==='touch'&&has(HOME+'/Documents/LinuxLab/practice.txt');
    case 3:return cmd==='cp'&&has(HOME+'/Documents/backup.txt')&&has(HOME+'/Documents/hello.txt');
    case 4:return cmd==='grep'&&args[0]==='Linux'&&norm(args.at(-1))===HOME+'/welcome.txt';
    case 5:return cmd==='ls'&&args.some(x=>x.startsWith('-')&&x.includes('l'))&&args.some(x=>norm(x)===HOME+'/Documents/setup.sh')&&fs[HOME+'/Documents/setup.sh']?.mode==='-rwxr-xr-x';
    case 6:return cmd==='nano'&&args[0]==='--version'&&installed.has('nano');
    case 7:return cmd==='grep'&&args[0]==='Learning'&&norm(args.at(-1))===HOME+'/linux-project/notes.txt';
    case 15:return cmd==='ps'&&args.includes('-ef');
    case 19:return cmd==='id'&&args.length===1&&args[0]==='student';
    case 18:return cmd==='ssh'&&args.length===1&&args[0]==='learner@practice.example';
    case 20:return cmd==='systemctl'&&args.join(' ')==='status apache2'&&servicesRunning.has('apache2');
    default:return false;
  }
}

function scenarioConsole(s){return `<section class="scenario-console" aria-label="Workplace scenario terminal"><div class="terminal-head"><div><strong>● Ubuntu workbench</strong><small> · isolated incident simulation</small></div><button class="tiny" data-action="scenario-help" type="button">Commands</button></div><div id="scenario-log" class="scenario-log" role="log" aria-live="polite">${s.log.map(line=>`<div class="line ${esc(line.kind)}">${line.kind==='input'?'<span class="ps1">tech@ubuntu:~$</span> ':''}${esc(line.text)}</div>`).join('')}</div><form id="scenario-form" class="scenario-form" autocomplete="off"><label for="scenario-input">tech@ubuntu:~$</label><input id="scenario-input" aria-label="Scenario command" placeholder="Type help or a Linux command…" spellcheck="false" autocapitalize="off" autocomplete="off"/><button class="run-btn" type="submit">Run ↵</button></form><div class="terminal-foot">Simulated responses · no network, real services, or accounts accessed</div></section>`;}
function scenarioView(){
  const sel=progress.scenarioSelected||'opening',c=scenarioById(sel),s=scenarioState(sel),goals=scenarioGoals(sel,s),passed=goals.filter(g=>g.ok).length,done=scenarioDone(sel);
  return `<div class="page-heading"><div class="eyebrow">YOU'RE THE PERSON ON CALL</div><h1>Real-world Linux missions</h1><p>Practice the responsibilities behind the commands. You receive a workplace ticket, inspect evidence, make a safe change, and demonstrate that the business requirement is met.</p></div>
  <div class="scenario-list" aria-label="Choose a work scenario">${scenarioCatalog.map((a,i)=>{const score=scenarioGoals(a.id,scenarioState(a.id));return `<button class="scenario-card ${a.id===sel?'selected':''}" data-scenario="${a.id}" ${a.id===sel?'aria-current="true"':''}><div class="scenario-card-top"><span class="eyebrow">CASE ${String(i+1).padStart(2,'0')}</span><span class="${score.every(x=>x.ok)?'text-success':'scenario-card-progress'}">${score.filter(x=>x.ok).length}/${score.length}</span></div><strong>${esc(a.title)}</strong><span>${esc(a.short)} · ${esc(a.duration)}</span></button>`}).join('')}</div>
  <section class="scenario-ticket" id="scenario-details"><div class="scenario-ticket-head"><div><span class="tag">${esc(c.type)}</span><span class="tag gray">${esc(c.ticket)}</span></div><button type="button" class="tiny" data-action="scenario-reset">↻ Reset this ticket</button></div><h2>${esc(c.title)}</h2><p class="scenario-role">Your role: <strong>${esc(c.role)}</strong> · ${esc(c.difficulty)} · ${esc(c.duration)}</p><p class="scenario-context">${esc(c.context)}</p><div class="scenario-callout"><strong>🎯 Your assignment</strong><p>${esc(c.mission)}</p></div><p class="scenario-evidence">${esc(c.evidence)}</p></section>
  <div class="scenario-workspace"><div class="scenario-main"><div class="scenario-action-heading"><h2>Work the ticket</h2><span>${passed}/${goals.length} requirements met</span></div>
    ${sel==='startup'?startupEditor(s):''}
    ${scenarioConsole(s)}
    <div class="scenario-shortcuts"><b>Try an investigation</b><div>${(sel==='opening'?['systemctl status storefront','journalctl -u storefront -n 10','ls -l /srv/storefront/config.env']:sel==='startup'?['cat requirements.txt','bash triage.sh urgent','bash triage.sh normal','bash triage.sh other']:['id avery','id blair','ls -ld /srv/reports','cat /etc/sudoers.d/deployers']).map(cmd=>`<button class="tiny" type="button" data-scenario-fill="${esc(cmd)}">${esc(cmd)}</button>`).join('')}</div></div>
  </div><aside class="scenario-side"><div class="scenario-goals"><h3>Acceptance checklist</h3><p>These requirements update when your simulation reaches the expected state.</p>${goals.map(g=>`<div class="scenario-goal"><span class="${g.ok?'goal-yes':'goal-open'}">${g.ok?'✓':'○'}</span><span>${esc(g.label)}</span></div>`).join('')}
  <div class="scenario-score" role="progressbar" aria-label="Scenario requirements met" aria-valuemin="0" aria-valuemax="${goals.length}" aria-valuenow="${passed}"><span style="width:${Math.round(100*passed/goals.length)}%"></span></div>${done?`<p class="scenario-done">✓ Ticket resolved in simulation</p>`:`<p class="scenario-pending">${goals.length-passed} requirement${goals.length-passed===1?'':'s'} remaining</p>`}</div>
  <div class="scenario-coach"><h3>Coach's desk</h3><p>Stuck? Reveal one clue at a time—just like asking a senior teammate for guidance.</p><button type="button" class="btn small" data-action="scenario-coach">${s.coaching<0?'Get a hint':s.coaching<2?'Next hint':'Start hints again'}</button>${s.coaching>=0?`<div class="scenario-coach-tip"><strong>Hint ${s.coaching+1} / 3</strong><p>${esc(c.hint[s.coaching])}</p></div>`:''}</div></aside></div>
  ${done?`<section class="scenario-debrief"><span class="eyebrow">AFTER-ACTION REVIEW</span><h2>What you just accomplished</h2><p>${esc(c.debrief)}</p><p><strong>On a real Ubuntu VM:</strong> ${esc(c.realWorld)}</p><div class="scenario-next"><button type="button" class="btn primary" data-scenario="${scenarioCatalog[(scenarioCatalog.findIndex(x=>x.id===sel)+1)%scenarioCatalog.length].id}">Try another ticket →</button><button type="button" class="btn ghost" data-view="learn">Return to the course</button></div></section>`:`<section class="scenario-practice-note"><strong>Important:</strong> Complete the checklist using commands and tests. Merely running a command is not proof that a system is healthy or an account has the correct privileges. This is a fictional sandbox—not a production runbook.</section>`}`;
}
function startupEditor(s){return `<section class="scenario-editor-card"><div class="scenario-editor-title"><div><h3>✎ Code workbench · triage.sh</h3><p>Update the script, then run three acceptance tests in the terminal below.</p></div><span class="tag gray">SIMULATED BASH</span></div><label class="sr-only" for="scenario-code">Editable Bash script for triage</label><textarea id="scenario-code" spellcheck="false" autocapitalize="off" rows="12" aria-label="Editable Bash script">${esc(s.script)}</textarea>${s.lastTest?`<div class="scenario-test-feedback">${esc(s.lastTest)}</div>`:''}<div class="scenario-editor-foot"><span>No production requests or customer data used</span><button type="button" class="tiny" data-action="scenario-reset-script">Restore starter script</button></div></section>`;}

function render(){const view=progress.view;document.getElementById('app').innerHTML=`<div class="wrap">${nav()}<main id="main">${view==='learn'?learnMarkup():view==='play'?playMarkup():view==='guide'?guideMarkup():view==='scenarios'?scenarioView():reviewMarkup()}</main><dialog id="pwa-install-dialog" class="install-help" aria-labelledby="pwa-dialog-title"><h2 id="pwa-dialog-title">Add Teach Me Linux to your Home Screen</h2><p>On iPhone, open this website in Safari, then:</p><ol><li>Tap the Share button in Safari.</li><li>Choose <strong>Add to Home Screen</strong>.</li><li>Make sure <strong>Open as Web App</strong> is enabled if offered, then tap Add.</li></ol><p>On Android, open it in Chrome and select <strong>Install app</strong> or <strong>Add to Home Screen</strong> from the browser menu. You can also use the website normally without installing it.</p><form method="dialog"><button class="btn primary" type="submit">Got it</button></form></dialog><footer class="footer"><span>Teach Me Linux · Ubuntu Edition · classroom-quality learning beta</span><span>Unofficial learning tool · Not affiliated with Canonical · <a target="_blank" rel="noopener noreferrer" href="https://ubuntu.com/desktop/docs/en/latest/tutorial/the-linux-command-line-for-beginners/">Official Ubuntu command-line guide</a> · <button type="button" class="reset-link" data-action="reset-progress">Clear my progress</button></span></footer></div>`;const out=document.getElementById('terminal-output');if(out)out.scrollTop=out.scrollHeight;}
document.addEventListener('submit',e=>{if(e.target.id==='terminal-form'){e.preventDefault();const inp=document.getElementById('command-input');runCommand(inp.value);}if(e.target.id==='vi-command-form'){e.preventDefault();editorCommand(document.getElementById('vi-command-input').value);}if(e.target.id==='scenario-form'){e.preventDefault();scenarioCommand(document.getElementById('scenario-input').value);}});
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;
  if(btn.hasAttribute('data-scenario')){selectScenario(btn.dataset.scenario);return;}
  if(btn.hasAttribute('data-scenario-fill')){const inp=document.getElementById('scenario-input');if(inp){inp.value=btn.dataset.scenarioFill;inp.focus();}return;}
  if(btn.hasAttribute('data-lesson')){selectLesson(Number(btn.dataset.lesson));return;}
  if(btn.hasAttribute('data-view')){changeView(btn.dataset.view);return;}
  if(btn.hasAttribute('data-quiz')){checkQuiz(btn.dataset.quiz);return;}
  if(btn.hasAttribute('data-predict')){answerPrediction(Number(btn.dataset.predict));return;}
  if(btn.hasAttribute('data-review')){toggleReview(Number(btn.dataset.review));return;}
  if(btn.hasAttribute('data-fill')){const inp=document.getElementById('command-input');if(inp){inp.value=btn.dataset.fill;inp.focus();}return;}
  if(btn.hasAttribute('data-practice')){const cmd=btn.dataset.practice;changeView('play');const inp=document.getElementById('command-input');if(inp){inp.value=cmd;inp.focus();}return;}
  switch(btn.dataset.action){case 'install-pwa':{const d=document.getElementById('pwa-install-dialog');if(d&&typeof d.showModal==='function')d.showModal();break;}case 'scenario-help':scenarioCommand('help');break;case 'scenario-coach':toggleCoach();break;case 'scenario-reset':resetScenario();break;case 'scenario-reset-script':{const st=scenarioState('startup');st.script=scenarioStarter;st.tests={};st.lastTest='Starter restored. Rerun all acceptance tests.';save();render();break;}case 'vi-load-example':if(editor){editor.draft=lessons[progress.selected].steps[currentSteps()].hint;editor.mode='insert';snapshotCurrent();save();render();document.getElementById('vi-editor')?.focus({preventScroll:true});}break;case 'vi-insert':toggleViMode('insert');break;case 'vi-normal':toggleViMode('normal');break;case 'vi-save':editorSave();break;case 'vi-quit':editorDiscard();break;case 'start':{const next=firstIncomplete();selectLesson(next===undefined?lessonOrder.at(-1):next);break;}
    case 'hint':{currentHint=currentHint===currentSteps()?-1:currentSteps();render();break;}
    case 'solo-hint':{soloHint=!soloHint;render();break;}
    case 'help':runCommand('help');break;
    case 'reset-sim':{if(window.confirm('Reset this practice terminal? Files created here will be cleared, but completed lesson progress will stay.')){newFilesystem();if(progress.view==='learn'&&!progress.completed[progress.selected])progress.steps[progress.selected]=0;snapshotCurrent();save();render();}break;}
    case 'reset-progress':{if(window.confirm('Clear all completed lessons and start from zero on this device?')){progress=defaultProgress();newFilesystem();snapshotCurrent();save();render();window.scrollTo(0,0);}break;}
  }
});
document.addEventListener('change',e=>{if(e.target.id==='course-lesson-select')selectLesson(Number(e.target.value));});
document.addEventListener('input',e=>{if(e.target.id==='scenario-code'){const st=scenarioState('startup');st.script=e.target.value.slice(0,12000);st.tests={};st.lastTest='Code changed — run all acceptance tests again.';st.verified=false;save();return;}if(e.target.id==='lesson-note'){progress.notes[progress.selected]=e.target.value.slice(0,3000);save();return;}if(e.target.id==='vi-editor'&&editor){editor.draft=e.target.value;snapshotCurrent();save();return;}if(e.target.id==='guide-search'){const old=e.target;guideSearch=old.value;const start=old.selectionStart;render();const neo=document.getElementById('guide-search');if(neo){neo.focus({preventScroll:true});try{neo.setSelectionRange(start,start);}catch(_e){}}}});
document.addEventListener('keydown',e=>{if(e.target.id==='vi-editor'&&editor){if(e.key==='Escape'&&editor.mode==='insert'){e.preventDefault();toggleViMode('normal');return;}if(e.key==='i'&&editor.mode==='normal'){e.preventDefault();toggleViMode('insert');return;}return;}if(e.target.id!=='command-input')return;const inp=e.target;if(e.key==='ArrowUp'){e.preventDefault();historyIndex=Math.max(0,historyIndex-1);inp.value=terminalHistory[historyIndex]||'';}if(e.key==='ArrowDown'){e.preventDefault();historyIndex=Math.min(terminalHistory.length,historyIndex+1);inp.value=terminalHistory[historyIndex]||'';}});
restoreCurrent();render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {scope:'./'}).catch(err => console.warn('Offline app registration unavailable:',err)));
}
</script>
</body>
</html>
